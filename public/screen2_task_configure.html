<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Configura Task - Kinetic Gallery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d9dde0",
                        "tertiary": "#006576",
                        "inverse-surface": "#0b0f10",
                        "on-error-container": "#510017",
                        "surface-container-low": "#eef1f3",
                        "surface-container-high": "#dfe3e6",
                        "surface-bright": "#f5f7f9",
                        "background": "#f5f7f9",
                        "surface": "#f5f7f9",
                        "primary": "#2f42eb",
                        "outline-variant": "#abadaf",
                        "on-secondary": "#f8f0ff",
                        "primary-fixed-dim": "#7b89ff",
                        "secondary-fixed-dim": "#ceb9ff",
                        "primary-container": "#8d98ff",
                        "error-container": "#f74b6d",
                        "on-primary": "#f3f1ff",
                        "on-surface-variant": "#595c5e",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#2c2f31",
                        "secondary": "#6a37d4",
                        "on-error": "#ffefef",
                        "on-surface": "#2c2f31",
                        "primary-fixed": "#8d98ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
    <!-- TopAppBar -->
    <header class="w-full top-0 sticky z-50 bg-[#f5f7f9] dark:bg-[#0f172a] flex justify-between items-center px-6 py-4 border-b border-surface-container-highest">
        <button class="text-on-surface p-2 rounded-full hover:bg-surface-container-low transition-colors" onclick="window.history.back()">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="text-xl font-bold text-[#2c2f31] dark:text-white font-headline">Nuovo Task</span>
        <button class="text-primary p-2 rounded-full hover:bg-primary-container/20 transition-colors font-bold text-sm" onclick="window.location.href='screen1_task_detail.html'">
            Salva
        </button>
    </header>

    <!-- Main Content -->
    <main class="px-6 pt-6 max-w-2xl mx-auto space-y-6">

        <form class="space-y-6">
            <!-- Titolo -->
            <div class="space-y-2">
                <label for="title" class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Titolo Task</label>
                <input type="text" id="title" class="w-full px-4 py-3 bg-surface-container-lowest border border-surface-container-highest rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface font-body font-semibold" placeholder="Es. Aggiornare documentazione">
            </div>

            <!-- Descrizione -->
            <div class="space-y-2">
                <label for="description" class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Descrizione</label>
                <textarea id="description" rows="4" class="w-full px-4 py-3 bg-surface-container-lowest border border-surface-container-highest rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface font-body resize-none" placeholder="Aggiungi dettagli sul task..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Data Scadenza -->
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Scadenza</label>
                    <div class="relative cursor-pointer" onclick="window.location.href='screen11_calendar.html'">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary">event</span>
                        <input type="text" readonly class="w-full pl-10 pr-4 py-3 bg-primary-container/10 border border-primary/20 rounded-xl text-primary font-bold cursor-pointer" value="Seleziona data">
                    </div>
                </div>

                <!-- Priorità -->
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Priorità</label>
                    <select class="w-full px-4 py-3 bg-surface-container-lowest border border-surface-container-highest rounded-xl focus:ring-2 focus:ring-primary text-on-surface font-bold appearance-none">
                        <option>Alta</option>
                        <option selected>Media</option>
                        <option>Bassa</option>
                    </select>
                </div>
            </div>

            <!-- Assegnatario -->
            <div class="space-y-2">
                <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Assegnato a</label>
                <div class="flex items-center justify-between p-3 bg-surface-container-lowest border border-surface-container-highest rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full border border-surface-container-highest bg-surface-container-high overflow-hidden">
                            <span class="material-symbols-outlined w-full h-full flex justify-center items-center text-outline-variant text-sm">person</span>
                        </div>
                        <span class="font-medium text-on-surface">Seleziona membro</span>
                    </div>
                    <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
                </div>
            </div>

            <!-- Allegati -->
            <div class="space-y-2">
                <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Allegati</label>
                <div class="flex items-center justify-center p-6 border-2 border-dashed border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors" onclick="window.location.href='screen5_attachment_source.html'">
                    <div class="flex flex-col items-center gap-2 text-on-surface-variant">
                        <span class="material-symbols-outlined text-3xl">upload_file</span>
                        <span class="text-sm font-medium">Carica o scatta foto</span>
                    </div>
                </div>
            </div>

        </form>
    </main>

    <!-- Bottom Action Area -->
    <div class="fixed bottom-0 left-0 right-0 p-6 bg-surface z-40 border-t border-surface-container-highest">
        <button class="w-full bg-primary text-on-primary py-4 rounded-xl font-extrabold text-lg shadow-lg shadow-primary/20 transition-transform active:scale-[0.98]" onclick="window.location.href='screen1_task_detail.html'">
            Crea Task
        </button>
    </div>
</body>
</html>
