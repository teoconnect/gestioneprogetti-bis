<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Calendario - Kinetic Gallery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d9dde0",
                        "tertiary": "#006576",
                        "inverse-surface": "#0b0f10",
                        "on-error-container": "#510017",
                        "surface-container-low": "#eef1f3",
                        "surface-container-high": "#dfe3e6",
                        "surface-bright": "#f5f7f9",
                        "background": "#f5f7f9",
                        "surface": "#f5f7f9",
                        "primary": "#2f42eb",
                        "outline-variant": "#abadaf",
                        "on-secondary": "#f8f0ff",
                        "primary-fixed-dim": "#7b89ff",
                        "secondary-fixed-dim": "#ceb9ff",
                        "primary-container": "#8d98ff",
                        "error-container": "#f74b6d",
                        "on-primary": "#f3f1ff",
                        "on-surface-variant": "#595c5e",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#2c2f31",
                        "secondary": "#6a37d4",
                        "on-error": "#ffefef",
                        "on-surface": "#2c2f31",
                        "primary-fixed": "#8d98ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
    <!-- TopAppBar -->
    <header class="w-full top-0 sticky z-50 bg-[#f5f7f9] dark:bg-[#0f172a] flex justify-between items-center px-6 py-4 border-b border-surface-container-highest">
        <button class="text-on-surface p-2 rounded-full hover:bg-surface-container-low transition-colors" onclick="window.history.back()">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="text-xl font-bold text-[#2c2f31] dark:text-white font-headline">Calendario</span>
        <button class="text-primary p-2 rounded-full hover:bg-primary-container/20 transition-colors" onclick="window.location.href='screen2_task_configure.html'">
            <span class="material-symbols-outlined">add</span>
        </button>
    </header>

    <!-- Main Content -->
    <main class="px-4 pt-4 max-w-md mx-auto space-y-6 pb-10">

        <!-- Month Selector -->
        <div class="flex justify-between items-center px-2">
            <button class="p-2 hover:bg-surface-container-low rounded-full"><span class="material-symbols-outlined">chevron_left</span></button>
            <h2 class="text-lg font-extrabold text-on-surface">Novembre 2023</h2>
            <button class="p-2 hover:bg-surface-container-low rounded-full"><span class="material-symbols-outlined">chevron_right</span></button>
        </div>

        <!-- Calendar Grid -->
        <div class="bg-surface-container-lowest rounded-3xl p-4 shadow-sm border border-surface-container-highest">
            <!-- Days of week -->
            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <div class="text-xs font-bold text-on-surface-variant">L</div>
                <div class="text-xs font-bold text-on-surface-variant">M</div>
                <div class="text-xs font-bold text-on-surface-variant">M</div>
                <div class="text-xs font-bold text-on-surface-variant">G</div>
                <div class="text-xs font-bold text-on-surface-variant">V</div>
                <div class="text-xs font-bold text-on-surface-variant">S</div>
                <div class="text-xs font-bold text-on-surface-variant">D</div>
            </div>

            <!-- Dates -->
            <div class="grid grid-cols-7 gap-1 text-center">
                <!-- Empty slots for previous month -->
                <div class="p-2 text-sm text-outline-variant">30</div>
                <div class="p-2 text-sm text-outline-variant">31</div>

                <!-- Active month days -->
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">1</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">2</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer relative">
                    3
                    <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-tertiary rounded-full"></div>
                </div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">4</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">5</div>

                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">6</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">7</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">8</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">9</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">10</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">11</div>

                <!-- Selected day -->
                <div class="p-2 text-sm font-bold bg-primary text-on-primary rounded-full cursor-pointer shadow-md shadow-primary/30 relative">
                    12
                </div>

                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">13</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">14</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer relative">
                    15
                    <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-secondary rounded-full"></div>
                </div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">16</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">17</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">18</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">19</div>

                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">20</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer relative">
                    21
                    <div class="absolute bottom-1 left-1/2 -translate-x-1/2 flex gap-0.5">
                        <div class="w-1 h-1 bg-primary rounded-full"></div>
                        <div class="w-1 h-1 bg-error-container rounded-full"></div>
                    </div>
                </div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">22</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">23</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">24</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">25</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">26</div>

                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">27</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">28</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">29</div>
                <div class="p-2 text-sm font-semibold text-on-surface hover:bg-surface-container-low rounded-full cursor-pointer">30</div>
            </div>
        </div>

        <!-- Schedule for selected day -->
        <div class="space-y-4">
            <h3 class="text-sm font-bold text-on-surface-variant uppercase tracking-widest px-2">Scadenze 12 Nov</h3>

            <div class="space-y-3">
                <div class="bg-surface-container-lowest p-4 rounded-2xl flex items-center gap-4 border-l-4 border-primary cursor-pointer shadow-sm" onclick="window.location.href='screen1_task_detail.html'">
                    <div class="flex-1">
                        <p class="text-sm font-bold text-on-surface">Finalize Brand Identity</p>
                        <p class="text-xs text-on-surface-variant mt-1">10:00 AM - 12:00 PM</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined text-[16px]">design_services</span>
                    </div>
                </div>

                <div class="bg-surface-container-lowest p-4 rounded-2xl flex items-center gap-4 border-l-4 border-error-container cursor-pointer shadow-sm" onclick="window.location.href='screen1_task_detail.html'">
                    <div class="flex-1">
                        <p class="text-sm font-bold text-on-surface">Meeting Clienti</p>
                        <p class="text-xs text-on-surface-variant mt-1">15:00 PM - 16:30 PM</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-error-container/10 flex items-center justify-center text-error-container">
                        <span class="material-symbols-outlined text-[16px]">video_camera_front</span>
                    </div>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
