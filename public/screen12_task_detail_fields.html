<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Modifica Metriche - Kinetic Gallery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d9dde0",
                        "tertiary": "#006576",
                        "inverse-surface": "#0b0f10",
                        "on-error-container": "#510017",
                        "surface-container-low": "#eef1f3",
                        "surface-container-high": "#dfe3e6",
                        "surface-bright": "#f5f7f9",
                        "background": "#f5f7f9",
                        "surface": "#f5f7f9",
                        "primary": "#2f42eb",
                        "outline-variant": "#abadaf",
                        "on-secondary": "#f8f0ff",
                        "primary-fixed-dim": "#7b89ff",
                        "secondary-fixed-dim": "#ceb9ff",
                        "primary-container": "#8d98ff",
                        "error-container": "#f74b6d",
                        "on-primary": "#f3f1ff",
                        "on-surface-variant": "#595c5e",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#2c2f31",
                        "secondary": "#6a37d4",
                        "on-error": "#ffefef",
                        "on-surface": "#2c2f31",
                        "primary-fixed": "#8d98ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface/50 text-on-surface min-h-screen flex flex-col justify-end">
    <!-- Overlay/Background blur -->
    <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 cursor-pointer" onclick="window.history.back()"></div>

    <main class="relative z-50 bg-surface-container-lowest w-full max-w-2xl mx-auto rounded-t-[32px] p-6 pb-12 space-y-8 shadow-2xl animate-[slideUp_0.3s_ease-out]">

        <!-- Drag Handle -->
        <div class="w-12 h-1.5 bg-outline-variant/30 rounded-full mx-auto mb-2"></div>

        <div class="flex justify-between items-center">
            <h2 class="text-xl font-extrabold text-on-surface font-headline">Aggiorna Metriche</h2>
            <button class="p-2 bg-surface-container-low rounded-full hover:bg-surface-container-high transition-colors" onclick="window.history.back()">
                <span class="material-symbols-outlined text-on-surface-variant">close</span>
            </button>
        </div>

        <form class="space-y-6">

            <!-- Budget -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[18px]">payments</span>
                    Budget Allocato
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface font-extrabold text-lg">$</span>
                    <input type="number" class="w-full pl-8 pr-4 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary text-on-surface font-extrabold text-xl" value="4500">
                </div>
            </div>

            <!-- Ore -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest flex items-center gap-2">
                    <span class="material-symbols-outlined text-tertiary text-[18px]">schedule</span>
                    Ore Investite
                </label>
                <div class="flex items-center gap-4">
                    <div class="relative flex-1">
                        <input type="number" class="w-full px-4 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-tertiary text-on-surface font-extrabold text-xl text-center" value="32.5" step="0.5">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">h</span>
                    </div>

                    <!-- Quick Add Buttons -->
                    <div class="flex gap-2">
                        <button type="button" class="w-12 h-12 rounded-xl bg-surface-container-high flex items-center justify-center font-bold text-on-surface hover:bg-tertiary/20 hover:text-tertiary active:scale-95 transition-all">+1</button>
                        <button type="button" class="w-12 h-12 rounded-xl bg-surface-container-high flex items-center justify-center font-bold text-on-surface hover:bg-tertiary/20 hover:text-tertiary active:scale-95 transition-all">+4</button>
                    </div>
                </div>
            </div>

            <!-- Stato Completamento -->
            <div class="space-y-3 pt-4 border-t border-surface-container-highest">
                <label class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Stato Avanzamento</label>
                <input type="range" class="w-full accent-primary" min="0" max="100" value="75">
                <div class="flex justify-between text-xs font-bold text-on-surface-variant">
                    <span>0%</span>
                    <span class="text-primary text-sm">75%</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-6">
                <button type="button" onclick="window.location.href='screen1_task_detail.html'" class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-2xl font-extrabold text-lg shadow-[0_8px_24px_rgba(47,66,235,0.2)] transition-transform active:scale-[0.98]">
                    Salva Metriche
                </button>
            </div>

        </form>
    </main>

    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Custom Range Slider Styling (basic fallback for Tailwind 'accent-*') */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #2f42eb;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 4px 10px rgba(47,66,235,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #dfe3e6;
            border-radius: 4px;
        }
    </style>
</body>
</html>
