<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Registrazione - Kinetic Gallery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d9dde0",
                        "tertiary": "#006576",
                        "inverse-surface": "#0b0f10",
                        "on-error-container": "#510017",
                        "surface-container-low": "#eef1f3",
                        "surface-container-high": "#dfe3e6",
                        "surface-bright": "#f5f7f9",
                        "background": "#f5f7f9",
                        "surface": "#f5f7f9",
                        "primary": "#2f42eb",
                        "outline-variant": "#abadaf",
                        "on-secondary": "#f8f0ff",
                        "primary-fixed-dim": "#7b89ff",
                        "secondary-fixed-dim": "#ceb9ff",
                        "primary-container": "#8d98ff",
                        "error-container": "#f74b6d",
                        "on-primary": "#f3f1ff",
                        "on-surface-variant": "#595c5e",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#2c2f31",
                        "secondary": "#6a37d4",
                        "on-error": "#ffefef",
                        "on-surface": "#2c2f31",
                        "primary-fixed": "#8d98ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6 py-12">
    <main class="w-full max-w-md bg-surface-container-lowest p-8 rounded-3xl shadow-lg space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-on-surface leading-tight">Crea Account</h1>
            <p class="text-on-surface-variant font-body">Inizia subito a gestire i tuoi progetti</p>
        </div>

        <form class="space-y-6">
            <div class="space-y-2">
                <label for="name" class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Nome Completo</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
                    <input type="text" id="name" class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary text-on-surface font-body" placeholder="Mario Rossi">
                </div>
            </div>

            <div class="space-y-2">
                <label for="email" class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
                    <input type="email" id="email" class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary text-on-surface font-body" placeholder="nome@esempio.com">
                </div>
            </div>

            <div class="space-y-2">
                <label for="password" class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
                    <input type="password" id="password" class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary text-on-surface font-body" placeholder="••••••••">
                </div>
            </div>

            <div class="space-y-2">
                <label for="confirm_password" class="block text-sm font-bold text-on-surface-variant uppercase tracking-widest">Conferma Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock_reset</span>
                    <input type="password" id="confirm_password" class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary text-on-surface font-body" placeholder="••••••••">
                </div>
            </div>

            <button type="button" onclick="window.location.href='screen6_dashboard.html'" class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-xl font-extrabold text-lg shadow-[0_8px_24px_rgba(47,66,235,0.2)] transition-transform active:scale-[0.98]">
                Registrati
            </button>
        </form>

        <div class="text-center">
            <p class="text-sm font-body text-on-surface-variant">Hai già un account? <a href="screen9_login.html" class="font-bold text-primary hover:text-primary-fixed-dim">Accedi</a></p>
        </div>
    </main>
</body>
</html>
