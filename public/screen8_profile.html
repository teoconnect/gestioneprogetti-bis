<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Profile - Kinetic Gallery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d9dde0",
                        "tertiary": "#006576",
                        "inverse-surface": "#0b0f10",
                        "on-error-container": "#510017",
                        "surface-container-low": "#eef1f3",
                        "surface-container-high": "#dfe3e6",
                        "surface-bright": "#f5f7f9",
                        "background": "#f5f7f9",
                        "surface": "#f5f7f9",
                        "primary": "#2f42eb",
                        "outline-variant": "#abadaf",
                        "on-secondary": "#f8f0ff",
                        "primary-fixed-dim": "#7b89ff",
                        "secondary-fixed-dim": "#ceb9ff",
                        "primary-container": "#8d98ff",
                        "error-container": "#f74b6d",
                        "on-primary": "#f3f1ff",
                        "on-surface-variant": "#595c5e",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#2c2f31",
                        "secondary": "#6a37d4",
                        "on-error": "#ffefef",
                        "on-surface": "#2c2f31",
                        "primary-fixed": "#8d98ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
    <!-- TopAppBar -->
    <header class="w-full top-0 sticky z-50 bg-[#f5f7f9] dark:bg-[#0f172a] flex justify-between items-center px-6 py-4">
        <span class="text-xl font-bold text-[#2c2f31] dark:text-white font-headline">Profilo</span>
        <button class="text-[#3E51F7] transition-all duration-200 active:scale-95 hover:bg-[#eef1f3] p-2 rounded-full" onclick="window.location.href='screen10_notifications.html'">
            <span class="material-symbols-outlined">notifications</span>
        </button>
    </header>

    <!-- Main Content -->
    <main class="px-6 pt-4 max-w-2xl mx-auto space-y-8">

        <!-- Header Profilo -->
        <section class="flex flex-col items-center space-y-4">
            <div class="relative">
                <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-surface-container-lowest shadow-md">
                    <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBraZm0w3XwAbWjm73ozhz0yInI2nKE3FzvnanLO14kMpPH1yqt42nKLFBops3aQvys-lCkx-ArsO6iu-7vJT0IW8tIqftJMndvhdGcDh4d2f30ekO68amY88bCfMprhl8ra2gdvS8SWNY-boi1BeGK9CjQfPyQFOPDgzU9r_tJwvm8IMhEs8irPVYT9mPGqHUE-rqv-5voW3xIEPoRj5Z3y1IseTBUAJJYOJawRSFkUy_KidzEBLJ_sWBxhNvSCfzQhDpkN4Mzb8Db"/>
                </div>
                <button class="absolute bottom-0 right-0 bg-primary text-on-primary w-8 h-8 rounded-full flex items-center justify-center border-2 border-surface shadow-sm">
                    <span class="material-symbols-outlined text-[16px]">edit</span>
                </button>
            </div>
            <div class="text-center">
                <h1 class="text-2xl font-extrabold text-on-surface">Mario Rossi</h1>
                <p class="text-sm text-on-surface-variant font-medium mt-1">Lead Designer</p>
                <p class="text-xs text-on-surface-variant mt-1">mario.rossi@kinetic.com</p>
            </div>
        </section>

        <!-- Stats -->
        <section class="flex justify-center gap-6 py-4 border-y border-surface-container-highest">
            <div class="text-center">
                <div class="text-2xl font-extrabold text-on-surface">45</div>
                <div class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mt-1">Task Fatti</div>
            </div>
            <div class="w-px h-10 bg-surface-container-highest"></div>
            <div class="text-center">
                <div class="text-2xl font-extrabold text-on-surface">12</div>
                <div class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mt-1">Progetti</div>
            </div>
        </section>

        <!-- Settings List -->
        <section class="space-y-2">
            <h2 class="text-sm font-bold text-on-surface-variant uppercase tracking-widest px-2 mb-3">Impostazioni</h2>

            <div class="bg-surface-container-lowest rounded-3xl overflow-hidden shadow-sm border border-surface-container-lowest">

                <div class="flex items-center gap-4 p-4 hover:bg-surface-container-low transition-colors cursor-pointer border-b border-surface-container-highest">
                    <div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <div class="flex-1 text-sm font-semibold text-on-surface">Informazioni Personali</div>
                    <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
                </div>

                <div class="flex items-center gap-4 p-4 hover:bg-surface-container-low transition-colors cursor-pointer border-b border-surface-container-highest">
                    <div class="w-10 h-10 rounded-full bg-tertiary/10 flex items-center justify-center text-tertiary">
                        <span class="material-symbols-outlined">lock</span>
                    </div>
                    <div class="flex-1 text-sm font-semibold text-on-surface">Sicurezza e Password</div>
                    <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
                </div>

                <div class="flex items-center gap-4 p-4 hover:bg-surface-container-low transition-colors cursor-pointer" onclick="window.location.href='screen10_notifications.html'">
                    <div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
                        <span class="material-symbols-outlined">notifications</span>
                    </div>
                    <div class="flex-1 text-sm font-semibold text-on-surface">Notifiche</div>
                    <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
                </div>

            </div>
        </section>

        <!-- Logout Button -->
        <section class="pt-4">
            <button class="w-full flex items-center justify-center gap-2 py-4 rounded-xl font-extrabold text-error-container bg-error-container/10 hover:bg-error-container/20 transition-colors" onclick="window.location.href='screen9_login.html'">
                <span class="material-symbols-outlined text-error-container">logout</span>
                Esci dall'account
            </button>
        </section>

    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 w-full z-50 rounded-t-3xl shadow-xl bg-white/80 backdrop-blur-xl flex justify-around items-center px-4 pb-6 pt-3 border-t border-surface-container-highest">
        <!-- Dashboard -->
        <div class="flex flex-col items-center justify-center text-[#595c5e] p-2 hover:opacity-80 transition-transform duration-300 ease-in-out cursor-pointer" onclick="window.location.href='screen6_dashboard.html'">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-['Inter'] text-[11px] font-medium">Dashboard</span>
        </div>
        <!-- Projects -->
        <div class="flex flex-col items-center justify-center text-[#595c5e] p-2 hover:opacity-80 transition-transform duration-300 ease-in-out cursor-pointer" onclick="window.location.href='screen4_projects.html'">
            <span class="material-symbols-outlined">folder_managed</span>
            <span class="font-['Inter'] text-[11px] font-medium">Projects</span>
        </div>
        <!-- Gantt -->
        <div class="flex flex-col items-center justify-center text-[#595c5e] p-2 hover:opacity-80 transition-transform duration-300 ease-in-out cursor-pointer" onclick="window.location.href='screen3_gantt_chart.html'">
            <span class="material-symbols-outlined">timeline</span>
            <span class="font-['Inter'] text-[11px] font-medium">Gantt</span>
        </div>
        <!-- Profile (ACTIVE) -->
        <div class="flex flex-col items-center justify-center bg-[#eef1f3] dark:bg-[#334155] text-[#3E51F7] rounded-2xl p-2 w-16 transition-transform duration-300 ease-in-out cursor-pointer" onclick="window.location.href='screen8_profile.html'">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
            <span class="font-['Inter'] text-[11px] font-medium">Profile</span>
        </div>
    </nav>
</body>
</html>
