<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Aggiungi Allegato - Kinetic Gallery</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d9dde0",
                        "tertiary": "#006576",
                        "inverse-surface": "#0b0f10",
                        "on-error-container": "#510017",
                        "surface-container-low": "#eef1f3",
                        "surface-container-high": "#dfe3e6",
                        "surface-bright": "#f5f7f9",
                        "background": "#f5f7f9",
                        "surface": "#f5f7f9",
                        "primary": "#2f42eb",
                        "outline-variant": "#abadaf",
                        "on-secondary": "#f8f0ff",
                        "primary-fixed-dim": "#7b89ff",
                        "secondary-fixed-dim": "#ceb9ff",
                        "primary-container": "#8d98ff",
                        "error-container": "#f74b6d",
                        "on-primary": "#f3f1ff",
                        "on-surface-variant": "#595c5e",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#2c2f31",
                        "secondary": "#6a37d4",
                        "on-error": "#ffefef",
                        "on-surface": "#2c2f31",
                        "primary-fixed": "#8d98ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface/50 text-on-surface min-h-screen flex flex-col justify-end">
    <!-- Simulating a Bottom Sheet Modal -->
    <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 cursor-pointer" onclick="window.history.back()"></div>

    <main class="relative z-50 bg-surface-container-lowest w-full max-w-2xl mx-auto rounded-t-[32px] p-6 space-y-6 shadow-2xl animate-[slideUp_0.3s_ease-out]">

        <!-- Drag Handle -->
        <div class="w-12 h-1.5 bg-outline-variant/30 rounded-full mx-auto mb-2"></div>

        <div class="flex justify-between items-center">
            <h2 class="text-xl font-extrabold text-on-surface font-headline">Aggiungi Allegato</h2>
            <button class="p-2 bg-surface-container-low rounded-full hover:bg-surface-container-high transition-colors" onclick="window.history.back()">
                <span class="material-symbols-outlined text-on-surface-variant">close</span>
            </button>
        </div>

        <!-- Options List -->
        <div class="space-y-3">

            <button class="w-full flex items-center gap-4 p-4 rounded-2xl bg-surface-container-low hover:bg-primary-container/10 transition-colors border border-transparent hover:border-primary/20 active:scale-[0.98]">
                <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined text-2xl">photo_camera</span>
                </div>
                <div class="flex-1 text-left">
                    <p class="text-sm font-bold text-on-surface">Scatta Foto</p>
                    <p class="text-xs text-on-surface-variant font-medium">Usa la fotocamera del dispositivo</p>
                </div>
            </button>

            <button class="w-full flex items-center gap-4 p-4 rounded-2xl bg-surface-container-low hover:bg-tertiary/10 transition-colors border border-transparent hover:border-tertiary/20 active:scale-[0.98]">
                <div class="w-12 h-12 rounded-xl bg-tertiary/10 flex items-center justify-center text-tertiary">
                    <span class="material-symbols-outlined text-2xl">image</span>
                </div>
                <div class="flex-1 text-left">
                    <p class="text-sm font-bold text-on-surface">Libreria Foto</p>
                    <p class="text-xs text-on-surface-variant font-medium">Scegli dalla galleria</p>
                </div>
            </button>

            <button class="w-full flex items-center gap-4 p-4 rounded-2xl bg-surface-container-low hover:bg-secondary/10 transition-colors border border-transparent hover:border-secondary/20 active:scale-[0.98]">
                <div class="w-12 h-12 rounded-xl bg-secondary/10 flex items-center justify-center text-secondary">
                    <span class="material-symbols-outlined text-2xl">folder</span>
                </div>
                <div class="flex-1 text-left">
                    <p class="text-sm font-bold text-on-surface">Sfoglia File</p>
                    <p class="text-xs text-on-surface-variant font-medium">Documenti, PDF, ecc.</p>
                </div>
            </button>

        </div>

        <!-- Drag & Drop Zone (Visual only) -->
        <div class="mt-4 border-2 border-dashed border-outline-variant/50 rounded-3xl p-8 flex flex-col items-center justify-center text-center gap-3 bg-surface-container-lowest/50">
            <span class="material-symbols-outlined text-outline-variant text-4xl">cloud_upload</span>
            <p class="text-sm font-bold text-on-surface-variant">Oppure trascina i file qui</p>
        </div>

    </main>

    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</body>
</html>
